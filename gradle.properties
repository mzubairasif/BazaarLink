# Project-wide Gradle settings.
# Set JDK for Gradle execution
org.gradle.java.home=D:\\Softwares\\Android Studio\\jbr





# Memory Allocation for Gradle Daemon & Dexing (Prevents OutOfMemory / GC Thrashing)
